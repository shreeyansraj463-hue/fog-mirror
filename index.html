<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fog mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
  touch-action: none;
  font-family: system-ui, sans-serif;
}

/* start */
#start {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
  color: #fff;
  text-align: center;
  z-index: 10;
}

#start button {
  margin-top: 20px;
  padding: 14px 24px;
  border-radius: 10px;
  border: 1px solid #fff3;
  background: #111;
  color: #fff;
  font-size: 16px;
}

/* canvas */
canvas {
  position: absolute;
  inset: 0;
}

/* brush UI */
#ui {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  left: calc(20px + env(safe-area-inset-left));
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 999px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}

#ui label {
  font-size: 13px;
  text-transform: lowercase;
}

#ui input {
  accent-color: white;
}

/* shutter */
#snap {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  right: calc(20px + env(safe-area-inset-right));
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<div id="start">
  <h1>fog mirror</h1>
  <p>nothing is uploaded. everything stays on your device.</p>
  <button id="startBtn">start</button>
  <p id="error"></p>
</div>

<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="main"></canvas>

<div id="ui">
  <label>brush</label>
  <input id="brush" type="range" min="7" max="38" value="15">
</div>

<button id="snap"></button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"></script>

<script>
'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');

let dpr = Math.min(devicePixelRatio || 1, 2);
let W, H;

const fogCanvas = document.createElement('canvas');
const fogCtx = fogCanvas.getContext('2d');

let brushSize = 15;
document.getElementById('brush').oninput = e => brushSize = +e.target.value;

/* resize */
function resize(){
  W = innerWidth * dpr;
  H = innerHeight * dpr;
  canvas.width = W;
  canvas.height = H;
  fogCanvas.width = W;
  fogCanvas.height = H;
}
resize();
addEventListener('resize', resize);

/* media */
async function setupMedia(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    video.srcObject = stream;
    await video.play();

  } catch(e){
    document.getElementById('error').textContent = "camera or microphone refused";
    throw e;
  }
}

/* mediapipe */
const hands = new Hands({locateFile:f=>
  `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
});
hands.setOptions({ maxNumHands:1 });

let lastHands = null;
hands.onResults(r=> lastHands=r);

/* fog init */
function initFog(){
  fogCtx.fillStyle='rgba(255,255,255,0.55)';
  fogCtx.fillRect(0,0,W,H);
}

/* erase */
function erase(x,y,r){
  fogCtx.globalCompositeOperation='destination-out';
  let g=fogCtx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(0,0,0,0.34)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  fogCtx.fillStyle=g;
  fogCtx.fillRect(x-r,y-r,r*2,r*2);
}

/* touch fallback */
canvas.addEventListener('touchmove',e=>{
  let t=e.touches[0];
  erase(t.clientX*dpr, t.clientY*dpr, brushSize*dpr);
},{passive:false});

/* loop */
let busy=false;

async function loop(){
  requestAnimationFrame(loop);

  ctx.save();
  ctx.scale(-1,1);
  ctx.drawImage(video,-W,0,W,H);
  ctx.restore();

  if(!busy){
    busy=true;
    await hands.send({image:video});
    busy=false;
  }

  if(lastHands && lastHands.multiHandLandmarks.length){
    let lm = lastHands.multiHandLandmarks[0];
    let tip = lm[8];
    let x = (1-tip.x)*W;
    let y = tip.y*H;

    erase(x,y,brushSize*dpr);
  }

  /* frost */
  ctx.save();
  ctx.filter=`blur(${18*dpr}px) brightness(1.18)`;
  ctx.globalAlpha=0.62;
  ctx.drawImage(canvas,0,0);
  ctx.globalCompositeOperation='destination-in';
  ctx.drawImage(fogCanvas,0,0);
  ctx.restore();
}

/* controls */
document.getElementById('snap').onclick=()=>{
  let a=document.createElement('a');
  a.href=canvas.toDataURL();
  a.download='fog.png';
  a.click();
};

/* start */
document.getElementById('startBtn').onclick=async ()=>{
  document.getElementById('start').style.display='none';
  await setupMedia();
  initFog();
  loop();
};
</script>

</body>
</html>
